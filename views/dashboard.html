<small>SIGNED IN</small>
<h1>Hello, {{name}}.</h1>
<section>
    <h2>Store {{storeId}}</h2>
    <p>This is the store assigned to your identity. All store data in this lab is fictional.</p>
    <dl>
        <dt>Account</dt>
        <dd>{{email}}</dd>
        <dt>Internal user ID</dt>
        <dd><code>{{userId}}</code></dd>
        <dt>Sign-in result</dt>
        <dd>{{result}}</dd>
    </dl>
</section>
<p><a class="button" href="/sales">Open Sales</a></p>
<form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <button>Sign out of DemoMart</button>
</form>
<p><small>This ends your DemoMart session. Your Auth0 session remains active.</small></p>
